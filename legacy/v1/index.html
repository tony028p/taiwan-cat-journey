<title>小貓環島記</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap">
<style>
/* Layout: one centered sketchbook column — film frame on top, the route as a row of postcard stops beneath. */
:root {
  --bg: #f4ede0; --paper: #fbf6ec; --ink: #5b4237; --muted: #8f7464; --accent: #d95b52; --line: #e3d6c3; --sea: #bcd9cf;
  --hand: "LXGW WenKai TC", "Noto Serif TC", "PingFang TC", "Microsoft JhengHei", serif;
  --ui: system-ui, -apple-system, "Segoe UI", "Noto Sans TC", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #23201f; --paper: #2d2928; --ink: #f1e4d4; --muted: #b9a594; --accent: #ef7d72; --line: #453c37; --sea: #3d5652; color-scheme: dark } }
:root[data-theme="dark"] { --bg: #23201f; --paper: #2d2928; --ink: #f1e4d4; --muted: #b9a594; --accent: #ef7d72; --line: #453c37; --sea: #3d5652; color-scheme: dark }
body { background: var(--bg); color: var(--ink); font-family: var(--ui);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 40px; }
.wrap { max-width: 1040px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; }
h1 { font-family: var(--hand); font-weight: 700; font-size: clamp(30px, 5vw, 46px); margin: 0; letter-spacing: 0.04em; text-wrap: balance; }
.sub { font-family: var(--hand); color: var(--muted); font-size: 17px; margin: 0; }
.frame { background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 10px; box-shadow: 0 10px 30px -18px rgba(70,45,30,.45); transform: rotate(-0.25deg); }
.stage { position: relative; width: 100%; max-width: 100%; aspect-ratio: 16 / 9; background: #e9e1d2; border-radius: 3px; overflow: hidden; }
.stage video, .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.fallbtn { position: absolute; inset: 0; margin: auto; width: 76px; height: 76px; border-radius: 50%; border: 0; background: rgba(251,246,236,.92); color: #5b4237; font-size: 28px; cursor: pointer; box-shadow: 0 4px 18px rgba(0,0,0,.2); }
.meta { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 16px; font-size: 13px; color: var(--muted); padding: 8px 4px 0; }
.meta b { color: var(--ink); font-weight: 600; }
h2 { font-family: var(--hand); font-size: 22px; margin: 8px 0 0; font-weight: 700; }
.stops { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 640px) { .stops { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.stop button { width: 100%; text-align: left; background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; cursor: pointer; color: var(--ink); display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; align-items: baseline; font: inherit; transition: border-color .2s, transform .2s; }
.stop button:hover { border-color: var(--accent); transform: translateY(-1px); }
.stop button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.stop.on button { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
.tc { font-variant-numeric: tabular-nums; font-size: 12px; color: var(--muted); grid-row: span 2; }
.zh { font-family: var(--hand); font-size: 20px; font-weight: 700; }
.en { font-size: 12px; color: var(--muted); }
.what { grid-column: 2; font-size: 12.5px; color: var(--muted); margin-top: 3px; line-height: 1.45; }
.note { font-size: 13px; color: var(--muted); line-height: 1.6; max-width: 65ch; margin: 0; }
@media (prefers-reduced-motion: reduce) { .stop button { transition: none; } }
</style>

<div class="wrap">
  <header>
    <h1>小貓環島記</h1>
    <p class="sub">一隻橘貓的台灣環島小旅行 · 60 秒</p>
  </header>

  <div class="frame">
    <div class="stage" id="stage">
      <video id="vid" src="cat-taiwan.mp4" poster="poster.jpg" controls playsinline preload="metadata"></video>
    </div>
    <div class="meta">
      <span>順時針一圈：台北 → 東海岸 → 南端 → 中央山脈 → 回到台北</span>
      <span>現在位置：<b id="now">台北</b></span>
    </div>
  </div>

  <h2>沿途八站</h2>
  <ol class="stops" id="stops"></ol>
  <p class="note">畫面全部以程式即時手繪：線條每秒輕微「抖動」八次，模仿鉛筆動畫；背景配樂是一段溫柔的音樂盒旋律。</p>
</div>

<script src="anim.js"></script>
<script>
(function () {
  const STOPS = [
    ['台北', 'Taipei', '台北 101 下出發，機車呼嘯而過'],
    ['九份', 'Jiufen', '黃昏老街，紅燈籠搖晃、芋圓冒煙'],
    ['太魯閣', 'Taroko Gorge', '走過紅橋，長春祠瀑布與大理石峽谷'],
    ['池上', 'Chishang', '騎單車穿過稻浪，熱氣球升空'],
    ['墾丁', 'Kenting', '鵝鑾鼻燈塔夕陽，被海浪嚇一跳'],
    ['阿里山', 'Alishan', '搭森林小火車看日出雲海'],
    ['日月潭', 'Sun Moon Lake', '划船釣魚，遠望慈恩塔'],
    ['台北', 'Taipei', '象山看 101 煙火，回家囉']
  ];
  const SEG = 7.5;
  const list = document.getElementById('stops'), now = document.getElementById('now');
  const vid = document.getElementById('vid'), stage = document.getElementById('stage');
  let seek = t => { vid.currentTime = t; vid.play().catch(() => {}); };
  let getT = () => vid.currentTime;
  STOPS.forEach((s, i) => {
    const li = document.createElement('li'); li.className = 'stop';
    const b = document.createElement('button'); b.type = 'button'; b.id = 'stop-' + i;
    const t = i * SEG, mm = '0:' + String(Math.floor(t)).padStart(2, '0');
    b.innerHTML = `<span class="tc">${mm}</span><span class="zh">${s[0]}</span><span class="en">${s[1]}</span><span class="what">${s[2]}</span>`;
    b.addEventListener('click', () => seek(t + 0.05));
    li.appendChild(b); list.appendChild(li);
  });
  const items = [...list.children];
  function mark() {
    const i = Math.min(7, Math.floor((getT() || 0) / SEG));
    items.forEach((li, k) => li.classList.toggle('on', k === i));
    now.textContent = STOPS[i][0];
    requestAnimationFrame(mark);
  }
  mark();

  // Fallback: if the video file can't load, draw the same animation live on a canvas.
  function useCanvas() {
    if (!window.CatTour || stage.querySelector('canvas')) return;
    vid.remove();
    const cv = document.createElement('canvas'); stage.appendChild(cv);
    const ctx = cv.getContext('2d');
    const btn = document.createElement('button'); btn.className = 'fallbtn'; btn.type = 'button'; btn.textContent = '▶'; btn.setAttribute('aria-label', '播放');
    stage.appendChild(btn);
    let playing = false, t = 2.5, last = 0;
    const size = () => { const r = stage.getBoundingClientRect(); const S = Math.min(1.5, Math.max(0.5, r.width * Math.min(2, devicePixelRatio || 1) / 1280)); cv.width = Math.round(1280 * S); cv.height = Math.round(720 * S); return S; };
    let S = size(); addEventListener('resize', () => { S = size(); CatTour.draw(ctx, t, S); });
    CatTour.draw(ctx, t, S);
    const loop = ts => { if (!playing) return; if (last) t += Math.min(0.1, (ts - last) / 1000); last = ts; if (t >= 60) t = 0; CatTour.draw(ctx, t, S); requestAnimationFrame(loop); };
    const toggle = () => { playing = !playing; btn.hidden = playing; last = 0; if (playing) requestAnimationFrame(loop); };
    btn.addEventListener('click', toggle); cv.addEventListener('click', toggle);
    getT = () => t; seek = nt => { t = nt; CatTour.draw(ctx, t, S); if (!playing) toggle(); };
  }
  vid.addEventListener('error', useCanvas);
  if (vid.error) useCanvas();
})();
</script>
